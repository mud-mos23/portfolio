<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog · Amos Bachigale</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #ffffff; --surface: #f5f5f5; --surface2: #eeeeee; --border: #e0e0e0;
      --accent: #1DB954; --accent-dim: rgba(29,185,84,0.08);
      --text: #111111; --text2: #555555; --text3: #999999;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 0 48px;
    }
    nav a { color: var(--text2); text-decoration: none; font-size: 14px; transition: color 0.2s; }
    nav a:hover { color: var(--text); }
    nav .logo { font-weight: 700; color: var(--accent); }

    h1 { font-size: 36px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
    .subtitle { color: var(--text2); font-size: 16px; margin-bottom: 48px; }

    .posts { display: grid; gap: 16px; padding-bottom: 80px; }
    .post-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; text-decoration: none; color: inherit;
      display: block; transition: all 0.2s;
    }
    .post-card:hover { border-color: var(--accent); background: var(--surface2); }
    .post-card .date { font-size: 12px; color: var(--text3); margin-bottom: 6px; }
    .post-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .post-card p { color: var(--text2); font-size: 14px; }

    .empty { color: var(--text3); font-size: 14px; text-align: center; padding: 60px 0; }

    footer {
      border-top: 1px solid var(--border); padding: 24px 0;
      text-align: center; font-size: 13px; color: var(--text3);
    }
    footer a { color: var(--text2); text-decoration: none; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="/portfolio/" class="logo">AB</a>
      <a href="/portfolio/">Portfolio</a>
    </nav>
    <h1>Blog</h1>
    <p class="subtitle">Thoughts on code, design, and building things.</p>
    <div class="posts" id="posts">
      <p class="empty">Loading...</p>
    </div>
    <footer>
      &copy; 2026 Amos Bachigale
    </footer>
  </div>
  <script>
    fetch('/portfolio/blog/index.json')
      .then(r => r.json())
      .then(posts => {
        const container = document.getElementById('posts');
        if (posts.length === 0) {
          container.innerHTML = '<p class="empty">No posts yet — check back soon.</p>';
          return;
        }
        container.innerHTML = posts.map(post => `
          <a href="/portfolio/blog/${post.slug}/" class="post-card">
            <div class="date">${post.date}</div>
            <h2>${post.title}</h2>
            <p>${post.excerpt}</p>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('posts').innerHTML = '<p class="empty">No posts yet — check back soon.</p>';
      });
  </script>
</body>
</html>
