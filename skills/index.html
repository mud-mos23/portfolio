<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills · Amos Bachigale</title>
  <link rel="icon" type="image/png" href="/portfolio/assets/icon-32.png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --surface2: #eeeeee;
      --border: #e0e0e0;
      --accent: #1DB954;
      --accent-dim: rgba(29, 185, 84, 0.08);
      --text: #111111;
      --text2: #555555;
      --text3: #999999;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html { scroll-behavior: smooth; height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100%; display: flex; flex-direction: column;
    }

    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    nav .container {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px;
    }
    nav .logo { font-weight: 700; font-size: 18px; color: var(--accent); text-decoration: none; }
    nav .links { display: flex; gap: 24px; }
    nav .links a {
      color: var(--text2); text-decoration: none; font-size: 14px;
      transition: color 0.2s;
    }
    nav .links a:hover { color: var(--text); }
    nav .links a.active { color: var(--accent); font-weight: 600; }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex; align-items: center;
      padding-top: 56px;
    }
    .hero .container { display: flex; align-items: center; justify-content: space-between; gap: 60px; }
    .hero-content { flex: 1; max-width: 560px; }
    .hero-greeting { color: var(--accent); font-size: 14px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
    .hero h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 800; line-height: 1.1; margin-bottom: 20px; letter-spacing: -1.5px; }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--text2); font-size: 18px; max-width: 520px; margin-bottom: 32px; }
    .hero-photo {
      flex-shrink: 0; width: 320px; height: 320px;
      border-radius: 50%; object-fit: cover;
      border: 4px solid var(--accent);
      box-shadow: 0 0 60px rgba(29,185,84,0.15);
    }
    .hero-cta { display: flex; gap: 16px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 50px;
      font-size: 14px; font-weight: 600; text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #1ed760; transform: translateY(-1px); }
    .btn-outline { border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--text2); background: var(--surface); }

    /* SECTIONS */
    section { padding: 100px 0; }
    .section-label {
      color: var(--accent); font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
    }
    .section-title { font-size: clamp(28px, 4vw, 36px); font-weight: 700; margin-bottom: 48px; letter-spacing: -0.5px; }

    /* ABOUT */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
    .about-text p { color: var(--text2); font-size: 15px; margin-bottom: 16px; }
    .about-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; text-align: center;
    }
    .stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-card .label { font-size: 12px; color: var(--text3); margin-top: 4px; }

    /* SKILLS */
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .skill-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 50px; padding: 10px 20px;
      font-size: 14px; color: var(--text2); text-align: center;
      transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    }
    .skill-chip svg { flex-shrink: 0; }
    .skill-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    /* PROJECTS */
    .projects-grid { display: grid; gap: 20px; }
    .project-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      transition: all 0.2s;
    }
    .project-card:hover { border-color: var(--accent); }
    .project-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .project-card p { color: var(--text2); font-size: 14px; margin-bottom: 16px; }
    .project-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .project-meta span {
      font-size: 11px; color: var(--text3); font-weight: 500;
      background: var(--surface2); padding: 4px 10px; border-radius: 50px;
    }
    .project-screenshots { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .project-screenshots img { width: 100%; border-radius: 8px; border: 1px solid var(--border); }
    .project-screenshots-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .project-screenshots-2 img { width: 100%; border-radius: 8px; border: 1px solid var(--border); }
    .project-links { display: flex; gap: 12px; }
    .project-links a {
      color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px; transition: color 0.2s;
    }
    .project-links a:hover { color: var(--accent); }

    /* BLOG */
    .blog-grid { display: grid; gap: 20px; }
    .blog-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      text-decoration: none; color: inherit;
      display: block; transition: all 0.2s;
    }
    .blog-card:hover { border-color: var(--accent); }
    .blog-card .date { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
    .blog-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .blog-card p { color: var(--text2); font-size: 14px; line-height: 1.5; }
    .blog-card .read-more {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--accent); font-size: 13px; font-weight: 500;
      margin-top: 12px;
    }

    /* CONTACT */
    .contact-links {
      display: flex; gap: 24px; flex-wrap: wrap;
    }
    .contact-links a {
      display: flex; align-items: center; gap: 8px;
      color: var(--text2); text-decoration: none;
      font-size: 15px; transition: color 0.2s;
    }
    .contact-links a:hover { color: var(--accent); }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); padding: 24px 0; margin-top: auto; }
    footer .container {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: var(--text3);
    }
    footer a { color: var(--text2); text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; gap: 32px; }
      .about-stats { grid-template-columns: repeat(3, 1fr); }
      nav .links { gap: 16px; }
      .hero .container { flex-direction: column-reverse; text-align: center; gap: 30px; }
      .hero { padding-top: 80px; }
      .hero p { margin-left: auto; margin-right: auto; }
      .hero-cta { justify-content: center; }
      .hero-photo { width: 200px; height: 200px; }
      section { padding: 60px 0; }
    }
    @media (max-width: 480px) {
      .about-stats { grid-template-columns: 1fr; }
      .skills-grid { grid-template-columns: repeat(2, 1fr); }
      .contact-links { flex-direction: column; }
    }
  </style>
</head>
